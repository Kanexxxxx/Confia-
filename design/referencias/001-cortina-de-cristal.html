else if(n===8){html=`<div class="form-card"><div class="row between"><span class="tag" id="wizardStep">Etapa 1 de 3</span><span class="small-text">Cadastro de lead</span></div><div class="progress-track"><span id="wizardBar" style="--p:33%"></span></div><div id="wizardContent"></div><div class="row between"><button class="btn" id="wizBack" disabled>Voltar</button><button class="btn primary" id="wizNext">Próximo →</button></div></div>`;setup=()=>{let step=0;const steps=[['Nome completo','text'],['E-mail','email'],['Empresa','text']];function draw(){$('#wizardStep').textContent='Etapa '+(step+1)+' de 3';$('#wizardBar').style.width=(step+1)*100/3+'%';$('#wizardContent').innerHTML=`<label class="label">${steps[step][0]}<input class="field" id="wizardValue" type="${steps[step][1]}" placeholder="Preencha este campo"></label>`;$('#wizBack').disabled=step===0;$('#wizNext').textContent=step===2?'Concluir ✓':'Próximo →'}click('#wizNext',()=>{if(step===2){showToast('Cadastro concluído (demonstração)');step=0}else step++;draw()});click('#wizBack',()=>{if(step>0){step--;draw()}});draw()}}

else if(n===10){html=`<div class="form-card"><div class="row between surface"><div><strong>Notificações inteligentes</strong><p class="small-text">Receber alertas da operação</p></div><input type="checkbox" id="glassToggle" role="switch" style="width:24px;height:24px;accent-color:#7bf6d8"></div><span id="switchState" class="muted">Notificações desativadas</span></div>`;setup=()=>event('#glassToggle','change',e=>{$('#switchState').textContent=e.target.checked?'Notificações ativadas':'Notificações desativadas'})}
else if(n===11){html=`<div class="form-card"><div class="row between"><strong>Prioridade da oportunidade</strong><strong id="sliderValue" style="font-size:26px;color:#9af2e0">50</strong></div><input type="range" id="prioritySlider" min="0" max="100" value="50" style="accent-color:#7bf6d8;width:100%"><div class="row between small-text"><span>Baixa</span><span>Alta</span></div></div>`;setup=()=>event('#prioritySlider','input',e=>$('#sliderValue').textContent=e.target.value)}
else if(n===12||n===22){html=`<div class="form-card" style="text-align:center"><label class="label">Nome da oportunidade</label><input class="field" id="saveName" placeholder="Novo negócio" value="Plano empresarial"><button class="btn primary" id="morphSave">${n===22?'Salvar com indicador':'Salvar oportunidade'} ↗</button><span class="small-text" id="saveStatus">Pronto para salvar</span></div>`;setup=()=>{let busy=false;click('#morphSave',async()=>{if(busy)return;busy=true;$('#morphSave').disabled=true;$('#morphSave').textContent='◌ Salvando…';$('#saveStatus').textContent='Simulando resposta do servidor';await wait(950);$('#morphSave').textContent='✓ Salvo';$('#saveStatus').textContent='Operação simulada';say('Oportunidade salva na demonstração');await wait(750);$('#morphSave').textContent='Salvar oportunidade ↗';$('#morphSave').disabled=false;busy=false})}}
else if(n===13||n===14){html=`<div class="form-card" style="text-align:center"><h2 class="h-title">${n===13?'Salvar uma alteração':'Validar um envio'}</h2><p class="muted">Feedback breve e não bloqueante.</p><button class="btn ${n===13?'primary':'danger'}" id="fireToast">${n===13?'Mostrar sucesso':'Mostrar erro'}</button></div>`;setup=()=>click('#fireToast',()=>showToast(n===13?'Alterações salvas com sucesso':'Falha simulada na conexão',n===14))}
else if(n===15){html=`<div class="form-card"><div class="surface" id="deleteItem">◈ Oportunidade: contrato anual</div><button class="btn danger" id="deleteBtn">Excluir negócio (demo)</button><div class="row" id="undoBox" style="display:none"><span>Registro removido</span><button class="btn small" id="undoBtn">Desfazer</button></div></div>`;setup=()=>{click('#deleteBtn',()=>{$('#deleteItem').style.display='none';$('#undoBox').style.display='flex';say('Registro removido no exemplo')});click('#undoBtn',()=>{$('#deleteItem').style.display='block';$('#undoBox').style.display='none';showToast('Exclusão desfeita')})}}
else if(n===16){html=`<div style="text-align:center"><h2 class="h-title">Arquivar oportunidade?</h2><button class="btn danger" id="openModal">Abrir confirmação</button></div><div class="modal-demo" id="dialogModal"><div class="glass modal-box" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">Arquivar oportunidade</h2><p class="muted">A ação será simulada nesta demonstração.</p><div class="row"><button id="cancelModal" class="btn">Cancelar</button><button id="confirmModal" class="btn danger">Arquivar</button></div></div></div>`;setup=()=>{function set(b){$('#dialogModal').classList.toggle('show',b)}click('#openModal',()=>set(true));click('#cancelModal',()=>set(false));click('#confirmModal',()=>{set(false);showToast('Arquivamento simulado')});document.addEventListener('keydown',e=>{if(e.key==='Escape')set(false)})}}
else if(n===17){html=`<div class="row between"><strong>Editar contato</strong><button class="btn primary" id="openEdit">✎ Abrir editor</button></div>${fakeRows(2)}<div id="backdrop" class="backdrop"></div><aside class="drawer" id="drawer"><div class="row between"><strong>Editar contato</strong><button class="btn small" id="closeEdit">✕</button></div><label class="label" style="margin-top:15px">Nome<input class="field" id="editedName" value="Ana Martins"></label><button class="btn primary" id="saveEdit" style="margin-top:12px">Salvar alteração</button></aside>`;setup=()=>{let show=b=>{$('#drawer').classList.toggle('show',b);$('#backdrop').classList.toggle('show',b)};click('#openEdit',()=>show(true));click('#closeEdit',()=>show(false));click('#backdrop',()=>show(false));click('#saveEdit',()=>{show(false);showToast('Nome atualizado: '+$('#editedName').value)})}}
else if(n===18){html=`<div class="form-card"><label class="label">Observações do lead</label><textarea id="autosaveText" rows="4" class="field" placeholder="Comece a digitar…"></textarea><span class="small-text" id="autoState">Sem alterações pendentes</span></div>`;setup=()=>{let t;event('#autosaveText','input',()=>{$('#autoState').textContent='Alterações não salvas';clearTimeout(t);t=setTimeout(()=>{$('#autoState').textContent='✓ Rascunho salvo (memória local da demo)';say('Rascunho pronto')},550)})}}
else if(n===20){html=`<div class="form-card"><strong>Validação de etapas</strong>${['Nome preenchido','E-mail verificado','Consentimento registrado'].map(x=>`<label class="tickline"><input type="checkbox" class="todo"> ${x}</label>`).join('')}<div class="progress-track"><span id="checkFill" style="--p:0%"></span></div><span id="checkCount" class="muted">0 de 3 concluídos</span></div>`;setup=()=>$$('.todo').forEach(b=>b.addEventListener('change',()=>{let done=$$('.todo:checked').length;$('#checkFill').style.width=(done/3*100)+'%';$('#checkCount').textContent=done+' de 3 concluídos'}))}
else if(n===21){html=`<div class="form-card"><label class="label">Notas internas</label><textarea class="field" id="countText" rows="4" maxlength="160" placeholder="Anote o contexto da negociação"></textarea><div class="row between"><span class="small-text">Máximo 160 caracteres</span><span id="countChars">0 / 160</span></div></div>`;setup=()=>event('#countText','input',e=>{$('#countChars').textContent=e.target.value.length+' / 160';$('#countChars').style.color=e.target.value.length>140?'#ffb6c0':'#9aeede'})}
else if(n===23){html=`<div class="form-card" style="text-align:center"><h2 class="h-title">Central de eventos</h2><button class="btn primary" id="toastMany">Gerar 3 eventos</button><p class="muted">Os avisos surgem sem bloquear a atividade.</p></div>`;setup=()=>click('#toastMany',()=>{showToast('Lead captado');setTimeout(()=>showToast('Sincronização concluída'),250);setTimeout(()=>showToast('Reunião programada'),500)})}
else if(n===24){html=`<div class="form-card"><label class="label">Identificador do cliente</label><div class="row" style="flex-wrap:nowrap"><input class="field" value="LEAD-2026-042" id="copyVal" readonly><button class="btn primary" id="copyBtn">Copiar</button></div><p id="copyState" class="muted">Copie com confirmação visual.</p></div>`;setup=()=>click('#copyBtn',async()=>{const text=$('#copyVal').value;try{await navigator.clipboard.writeText(text);$('#copyState').textContent='✓ Copiado para área de transferência'}catch{$('#copyVal').select();$('#copyState').textContent='Selecione e copie o identificador (Ctrl+C)'}})}
else {html=`<div class="form-card"><label class="label">Rascunho recuperável<textarea class="field" id="persistentDraft" rows="4" placeholder="Escreva uma anotação…"></textarea></label><div class="row between"><button class="btn small" id="clearDraft">Limpar</button><span id="persistentState" class="small-text">Armazenamento local</span></div></div>`;setup=()=>{let key='crm_premium_demo_draft';try{$('#persistentDraft').value=localStorage.getItem(key)||''}catch{}event('#persistentDraft','input',e=>{try{localStorage.setItem(key,e.target.value);$('#persistentState').textContent='✓ Rascunho salvo no navegador'}catch{$('#persistentState').textContent='Armazenamento indisponível'}});click('#clearDraft',()=>{$('#persistentDraft').value='';try{localStorage.removeItem(key)}catch{}$('#persistentState').textContent='Rascunho apagado'})}}
app.innerHTML=`<div class="form-card" style="width:100%;max-width:540px">${html}</div>`;setup()}
const grp=M.group;const n=M.local;const badge=$('#demoBadge');if(badge)badge.textContent=M.id.toString().padStart(3,'0')+' / 100';if(grp===0)loaders(n);else if(grp===1)nav(n);else if(grp===2)dataDemo(n);else formDemo(n);
})();
</script></body></html>
