<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>confia? — Verifique antes de clicar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#132449;
    --ink:#14294f;
    --ink-soft:#1d3663;
    --card:#fafafa;
    --muted:#ecedf2;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}

  body{
    min-height:100vh;
    font-family:"Poppins","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 420px at 50% -8%, rgba(96,140,225,.28), transparent 70%),
      radial-gradient(600px 380px at 12% 22%, rgba(70,110,200,.16), transparent 70%),
      radial-gradient(600px 380px at 88% 22%, rgba(70,110,200,.16), transparent 70%),
      var(--bg);
    background-attachment:fixed;
  }

  /* ---------- barra superior (vidro fosco estilo iOS) ---------- */
  .topbar{
    position:fixed;
    top:0; left:0; right:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:18px;
    padding:22px 34px;
  }

  .glass{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px;
    border-radius:999px;
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:
      0 10px 34px rgba(4,12,32,.35),
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 -1px 0 rgba(255,255,255,.06);
  }

  .nav-link{
    display:inline-block;
    padding:11px 22px;
    border-radius:999px;
    border:1px solid transparent;
    color:rgba(255,255,255,.86);
    font-size:15px;
    font-weight:500;
    text-decoration:none;
    white-space:nowrap;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .nav-link:hover{background:rgba(255,255,255,.10); color:#fff}

  .nav-link.is-active{
    background:rgba(255,255,255,.16);
    border-color:rgba(255,255,255,.34);
    color:#fff;
    font-weight:600;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  }

  .avatar{
    width:60px; height:60px;
    display:grid; place-items:center;
    border-radius:50%;
    background:#fff;
    color:var(--ink);
    box-shadow:0 10px 26px rgba(4,12,32,.32);
    flex:none;
  }
  .avatar svg{width:32px;height:32px}

  /* ---------- palco ---------- */
  .stage{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,816px) minmax(0,1fr);
    align-items:center;
    gap:36px;
    min-height:100vh;
    padding:132px 26px 56px;
  }

  .rail{display:flex;flex-direction:column;gap:17px}
  .rail--left{align-items:flex-start}
  .rail--right{align-items:flex-end}
  .rail i{
    display:block;
    height:104px;
    border-radius:16px;
    background:#fff;
    box-shadow:0 6px 20px rgba(4,12,32,.18);
  }
  .w-lg{width:233px}
  .w-md{width:176px}
  .w-sm{width:166px}

  /* ---------- painel central ---------- */
  .frame{
    width:100%;
    max-width:816px;
    padding:20px;
    border:2px solid rgba(255,255,255,.5);
    border-radius:32px;
  }

  .card{
    background:var(--card);
    border-radius:24px;
    padding:66px 60px 46px;
    text-align:center;
    box-shadow:0 26px 60px rgba(4,12,32,.28);
  }

  /* logo */
  .logo{
    margin:0;
    font-size:clamp(58px,8.4vw,116px);
    font-weight:700;
    line-height:1;
    letter-spacing:-.02em;
    color:var(--ink);
  }
  .lens{
    display:inline-block;
    position:relative;
    width:.60em;
    height:.56em;
    vertical-align:baseline;
  }
  .lens svg{
    position:absolute;
    left:-.015em;
    bottom:-.04em;
    width:.65em;
    height:.65em;
    overflow:visible;
  }

  .tagline{
    margin:26px auto 0;
    max-width:520px;
    font-size:clamp(15px,1.35vw,19px);
    font-weight:500;
    line-height:1.55;
    color:var(--ink);
  }

  /* campo de busca */
  .field{position:relative;margin-top:48px}
  .field input{
    width:100%;
    height:66px;
    padding:0 56px 0 22px;
    border:1.5px solid var(--ink);
    border-radius:12px;
    background:#fff;
    font-family:inherit;
    font-size:17px;
    color:var(--ink);
    outline:none;
    transition:box-shadow .2s ease, border-color .2s ease;
  }
  .field input::placeholder{color:#8b93a6}
  .field input:focus{box-shadow:0 0 0 4px rgba(20,41,79,.12)}
  .field .cursor{
    position:absolute;
    right:20px; top:50%;
    transform:translateY(-50%);
    width:30px; height:30px;
    color:var(--ink);
    pointer-events:none;
  }

  /* botoes */
  .actions{
    display:flex;
    justify-content:center;
    gap:66px;
    margin-top:46px;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    width:258px;
    height:74px;
    border:none;
    border-radius:38px;
    background:var(--ink);
    color:#fff;
    font-family:inherit;
    font-size:16px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow:0 12px 26px rgba(20,41,79,.28);
    transition:transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .btn svg{width:26px;height:26px;flex:none}
  .btn:hover{background:var(--ink-soft);transform:translateY(-2px);box-shadow:0 16px 32px rgba(20,41,79,.34)}
  .btn:active{transform:translateY(0)}

  /* rodape do card */
  .note{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:54px;
    padding:18px 22px;
    border-radius:14px;
    background:var(--muted);
    text-align:left;
  }
  .note .shield{
    display:grid; place-items:center;
    width:40px; height:40px;
    flex:none;
    border-radius:12px;
    background:#dbe6fb;
    color:#3f6fd1;
  }
  .note .shield svg{width:22px;height:22px}
  .note p{margin:0}
  .note strong{display:block;font-size:16px;font-weight:600;color:var(--ink)}
  .note span{display:block;font-size:14px;font-weight:400;color:#4a5876;margin-top:2px}

  /* ---------- responsivo ---------- */
  @media (max-width:1180px){
    .rail{display:none}
    .stage{grid-template-columns:minmax(0,1fr);justify-items:center}
  }
  @media (max-width:760px){
    .topbar{justify-content:space-between;padding:16px}
    .glass{overflow-x:auto;max-width:calc(100% - 76px);scrollbar-width:none}
    .glass::-webkit-scrollbar{display:none}
    .nav-link{padding:9px 15px;font-size:14px}
    .avatar{width:50px;height:50px}
    .avatar svg{width:27px;height:27px}
    .stage{padding:108px 16px 40px}
    .frame{padding:12px;border-radius:26px}
    .card{padding:38px 24px 28px;border-radius:20px}
    .actions{flex-direction:column;align-items:center;gap:16px}
    .btn{width:100%;max-width:320px;height:64px}
    .field input{height:58px;font-size:15px;padding-right:54px}
  }
</style>
</head>
<body>

  <header class="topbar">
    <nav class="glass">
      <a class="nav-link is-active" href="#">Confia?</a>
      <a class="nav-link" href="#">Histórico</a>
      <a class="nav-link" href="#">Como funciona</a>
      <a class="nav-link" href="#">Premium</a>
      <a class="nav-link" href="#">Docs</a>
    </nav>

    <div class="avatar" aria-label="Conta">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/>
        <path d="M12 13.5c-4.2 0-7.5 2.6-7.5 5.9 0 .3.3.6.7.6h13.6c.4 0 .7-.3.7-.6 0-3.3-3.3-5.9-7.5-5.9z"/>
      </svg>
    </div>
  </header>

  <div class="stage">
    <div class="rail rail--left" aria-hidden="true">
      <i class="w-lg"></i><i class="w-md"></i><i class="w-lg"></i><i class="w-sm"></i>
      <i class="w-lg"></i><i class="w-md"></i><i class="w-lg"></i>
    </div>

    <main class="frame">
      <div class="card">

        <h1 class="logo">c<span class="lens"><svg viewBox="0 0 80 80" fill="none" aria-hidden="true">
            <g transform="rotate(45 40 40)">
              <rect x="66" y="35" width="44" height="10" rx="5" stroke="currentColor" stroke-width="5.5"/>
            </g>
            <circle cx="40" cy="40" r="32" stroke="currentColor" stroke-width="13"/>
            <path d="M20.7 34.8A20 20 0 0 1 31.6 21.9" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
          </svg></span>nfia?</h1>

        <p class="tagline">
          Antes de clicar ou pagar... confia?<br>
          Verifique links, sites e perfis e descubra em segundos se é golpe ou seguro.
        </p>

        <div class="field">
          <input id="alvo" type="text" aria-label="Link ou arquivo para verificar"
                 placeholder="Cole aqui URL ou fotos e vídeos de perfis ou print de mensagens">
          <svg class="cursor" viewBox="-3 -3 30 30" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 .3v1.4M4.4 1.9l1 1M11.6 1.9l-1 1"/>
            <path d="M22 14a8 8 0 0 1-8 8"/>
            <path d="M18 11v-1a2 2 0 0 0-4 0"/>
            <path d="M14 10V9a2 2 0 0 0-4 0v1"/>
            <path d="M10 9.5V4a2 2 0 0 0-4 0v10"/>
            <path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/>
          </svg>
        </div>

        <div class="actions">
          <button class="btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 13v8"/><path d="m8 17 4-4 4 4"/>
              <path d="M20.9 18.1A5 5 0 0 0 18 9h-1.3A8 8 0 1 0 3 16.3"/>
            </svg>
            Uploads
          </button>

          <button class="btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/>
            </svg>
            Verificar
          </button>
        </div>

        <div class="note">
          <div class="shield">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 1.6 4.4 4.4a1 1 0 0 0-.6.9V12c0 5 3.6 8.6 7.9 10.3.2.1.5.1.7 0C16.6 20.6 20.2 17 20.2 12V5.3a1 1 0 0 0-.6-.9L12 1.6z"/>
            </svg>
          </div>
          <p>
            <strong>Sua segurança começa aqui.</strong>
            <span>Verifique antes de clicar e evite golpes.</span>
          </p>
        </div>

      </div>
    </main>

    <div class="rail rail--right" aria-hidden="true">
      <i class="w-lg"></i><i class="w-md"></i><i class="w-lg"></i><i class="w-sm"></i>
      <i class="w-lg"></i><i class="w-md"></i><i class="w-lg"></i>
    </div>
  </div>

</body>
</html>
